<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$heading · Coral</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.55 "Plus Jakarta Sans", system-ui, sans-serif;
      background: #fbf9f8;
      color: #4b4b4b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 8vh, 80px) 16px; }
    main {
      max-width: 540px;
      margin: 0 auto;
      padding: clamp(20px, 6vw, 36px);
      background: white;
      border: 2px solid #e5e5e5;
      border-radius: 24px;
      box-shadow: 0 4px 0 #e5e5e5;
    }
    h1 { margin: 0 0 6px; font-size: 2rem; line-height: 1.2; letter-spacing: -.035em; }
    p { margin: 0 0 16px; }
    .setup, .notice { margin-bottom: 20px; padding: 14px 16px; border: 2px solid #ffdda7; border-radius: 16px; background: #fff7eb; }
    .notice[role="status"] { background: #edf8e2; border-color: #bedcaa; }
    .notice[role="alert"] { background: #fff0ee; border-color: #f2bfba; }
    .setup p { margin-bottom: 10px; }
    a { color: #0b6187; font-weight: 650; }
    dl { margin: 0; }
    dt, label { font-size: .875rem; font-weight: 700; }
    dd { margin: 2px 0 10px; overflow-wrap: anywhere; }
    dd:last-child { margin-bottom: 0; }
    code { font-size: .875rem; }
    label { display: block; margin-bottom: 5px; }
    input:not([type="hidden"]) {
      width: 100%;
      padding: 11px 13px;
      margin-bottom: 16px;
      border: 2px solid #d8d8d8;
      border-radius: 14px;
      background: #f7f7f7;
      color: inherit;
      font: inherit;
    }
    button {
      min-height: 44px;
      padding: 8px 18px;
      border: 2px solid #e07800;
      border-radius: 14px;
      box-shadow: 0 4px 0 #e07800;
      background: #ff9600;
      color: #382000;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
    }
    button:active { transform: translateY(4px); box-shadow: none; }
    :focus-visible { outline: 2px solid #117cad; outline-offset: 3px; }
    .sign-out { margin-top: 22px; }
    .sign-out button { color: inherit; background: white; border-color: #e5e5e5; box-shadow: 0 4px 0 #e5e5e5; }
  </style>
</head>
<body>
  <main>
    <h1>$heading</h1>
    $notice
    $content
  </main>
</body>
</html>
