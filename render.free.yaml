# Use these settings when creating New -> Web Service with the Free plan.
# External PostgreSQL and the scheduler token are required; no local disk fallback.
services:
  - type: web
    name: coral-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: CORAL_ADMIN_PASSWORD
        sync: false
      - key: CORAL_ENCRYPTION_KEY
        sync: false
      - key: CORAL_SCHEDULER_TOKEN
        sync: false
      - key: CORAL_DATABASE_URL
        sync: false
      - key: CORAL_WEB_URL
        value: https://mathobsession.github.io/Coral
      - key: CORAL_DATABASE
        value: /tmp/coral/control-plane.sqlite
      - key: CORAL_HOSTING_MODE
        value: render-free
      - key: CORAL_DEMO
        value: "0"
